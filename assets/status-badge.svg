<svg xmlns="http://www.w3.org/2000/svg" width="290" height="28" viewBox="0 0 290 28" role="img" aria-label="Status: production deployed, pilot-stage product">
  <title>Status: production deployed, pilot-stage product</title>
  <!--
    The badge says the least flattering true thing, on purpose. "Live" on its
    own sounds finished; "pilot-stage product" does not.
  -->
  <clipPath id="r"><rect width="290" height="28" rx="6"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="56" height="28" fill="#1A1725"/>
    <rect x="56" width="234" height="28" fill="#5B35B0"/>
  </g>
  <g fill="#F8F6FF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <text x="28" y="18.5">status</text>
    <text x="173" y="18.5">production deployed, pilot stage</text>
  </g>
</svg>
