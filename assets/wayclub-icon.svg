<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="WayClub">
  <title>WayClub</title>
  <!--
    The application icon: the waypoint, lit, on the product's own violet.

    The field is the gradient the primary action wears, so the icon and the
    button a person presses are visibly the same material. The point is the
    only warm thing in the mark.

    Platform constraint, learned by testing: iOS and Android mask app icons to
    their own shape, so nothing that matters may sit near the corners. The tile
    is full bleed and the glyph spans x=13 to x=35 and y=14 to y=34 on a 48
    grid, comfortably inside the roughly 80 percent circle every mask keeps. An
    earlier icon let a stroke break past a badge's shoulder and the platform
    simply cut it off.
  -->
  <defs>
    <linearGradient id="wc-field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A280FF" />
      <stop offset="1" stop-color="#5B34B8" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="11" fill="url(#wc-field)" />

  <g fill="none" stroke="#FFFFFF" stroke-width="5.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M18.4 14.4 H13.6 V33.6 H18.4" />
    <path d="M29.6 14.4 H34.4 V33.6 H29.6" />
  </g>

  <!-- A soft halo, then the point, so it reads as lit rather than printed. One
       shape at low opacity rather than a blur filter, because filters rasterise
       unpredictably at favicon sizes. -->
  <circle cx="24" cy="24" r="9.2" fill="#5EE7C4" opacity="0.20" />
  <circle cx="24" cy="24" r="5.4" fill="#5EE7C4" />
</svg>
