<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" role="img" aria-label="One event record carrying six phases: proposal, approval, registration, attendance, report and verified record">
  <title>One connected event record</title>
  <desc>A single event record carries a proposal, a multi-stage approval, a registration list, attendance, a post-event report and a student's verified involvement record. Each phase is drawn as a chip on one continuous rail, because they are one object rather than six handoffs.</desc>
  <!--
    Drawn on the product's own dark card surface rather than on the page, so it
    reads on a light and a dark GitHub theme without two files. The rail is one
    continuous line for the same reason the product has one record: the point
    is that nothing is handed over.
  -->
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5EE7C4" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#5B35B0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5B35B0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="149" rx="18" fill="#12101B" stroke="#2E2A3D"/>
  <rect x="0.5" y="0.5" width="719" height="149" rx="18" fill="url(#glow)"/>

  <!-- The rail: one line, not five arrows between five boxes. -->
  <line x1="42" y1="70" x2="678" y2="70" stroke="url(#rail)" stroke-width="2" stroke-linecap="round"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <g font-size="13" font-weight="600" text-anchor="middle">
      <rect x="30" y="52" width="96" height="36" rx="18" fill="#1A1725" stroke="#413A5C"/>
      <text x="78" y="74.5" fill="#D7CCFF">Proposal</text>

      <rect x="146" y="52" width="96" height="36" rx="18" fill="#1A1725" stroke="#413A5C"/>
      <text x="194" y="74.5" fill="#D7CCFF">Approval</text>

      <rect x="262" y="52" width="112" height="36" rx="18" fill="#1A1725" stroke="#413A5C"/>
      <text x="318" y="74.5" fill="#D7CCFF">Registration</text>

      <rect x="394" y="52" width="106" height="36" rx="18" fill="#1A1725" stroke="#413A5C"/>
      <text x="447" y="74.5" fill="#D7CCFF">Attendance</text>

      <rect x="520" y="52" width="80" height="36" rx="18" fill="#1A1725" stroke="#413A5C"/>
      <text x="560" y="74.5" fill="#D7CCFF">Report</text>

      <rect x="620" y="52" width="70" height="36" rx="18" fill="#0A3B32" stroke="#0C6A58"/>
      <text x="655" y="74.5" fill="#A7F4DC">Record</text>
    </g>

    <g font-size="10.5" fill="#938FA5" text-anchor="middle">
      <text x="78" y="108">entered once</text>
      <text x="194" y="108">conditional stages</text>
      <text x="318" y="108">capacity, waitlist, fee</text>
      <text x="447" y="108">code check-in</text>
      <text x="560" y="108">pre-filled from real rows</text>
      <text x="655" y="108">private, verified</text>
    </g>

    <text x="360" y="133" font-size="11.5" fill="#AAA6BD" text-anchor="middle">One record. Fifteen server-owned states. Every transition audited, and nothing re-keyed between phases.</text>
  </g>
</svg>
