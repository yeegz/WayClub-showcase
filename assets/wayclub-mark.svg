<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WayClub">
  <title>WayClub</title>
  <!--
    The waypoint: two brackets framing a single lit point. A place, marked; a
    point on a way.

    It replaced a bold W. That mark was competent and anonymous, because
    drawing the letter the name starts with is what a product does when it has
    not found an idea. This one says what WayClub is, and it survives being
    shrunk: two brackets and a dot are three simple forms with generous space
    between them, so at 16px they stay three forms rather than closing into a
    blob.

    In the product the frame inherits currentColor and the point reads a custom
    property, so a club's space can light the point in the club's own hue with
    no variant file. Here the values are explicit, because GitHub renders this
    file as an image: nothing is inherited and no custom property resolves.
  -->
  <g fill="none" stroke="#8B5CF6" stroke-width="4.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.4 8.6 H8.1 V23.4 H11.4" />
    <path d="M20.6 8.6 H23.9 V23.4 H20.6" />
  </g>
  <circle cx="16" cy="16" r="7.4" fill="#5EE7C4" opacity="0.18" />
  <circle cx="16" cy="16" r="4.1" fill="#5EE7C4" />
</svg>
