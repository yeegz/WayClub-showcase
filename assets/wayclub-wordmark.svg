<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 32" role="img" aria-label="WayClub">
  <title>WayClub</title>
  <!--
    Horizontal lockup for the application header and the public site.

    Set in the product's own UI face (Inter), not a display face bought for a
    logo. That is deliberate: WayClub's identity comes from restraint and
    consistency, and a header using a different typeface from the interface
    beneath it is the seam users notice first.

    "Way" carries the ink weight and "Club" drops to secondary, so the eye reads
    the route before the community, which is the order the product works in.
    Clear space either side is 8 units, matching the mark's stroke weight.
  -->
  <path d="M4 7 L10.6 25 L16 12.6 L21.4 25 L28 3.5"
        fill="none" stroke="currentColor" stroke-width="3.9"
        stroke-linecap="round" stroke-linejoin="round" />

  <text x="40" y="23"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="21" font-weight="650" letter-spacing="-0.5"
        fill="currentColor">Way<tspan fill-opacity="0.6" font-weight="550">Club</tspan></text>
</svg>
