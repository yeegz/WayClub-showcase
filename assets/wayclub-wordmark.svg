<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 32" role="img" aria-label="WayClub">
  <title>WayClub</title>
  <!--
    Horizontal lockup: the waypoint beside the name.

    Set in the product's own interface face rather than a display face bought
    for a logo. WayClub's identity comes from restraint and consistency, and a
    header using a different typeface from the interface beneath it is the seam
    a reader notices first.

    "Way" carries the ink weight and "Club" drops to secondary, so the eye
    reads the route before the community, which is the order the product works
    in. The point stays emerald: it is the one lit thing in the mark, and the
    lockup would lose the whole idea by flattening it.
  -->
  <g fill="none" stroke="#8B5CF6" stroke-width="4.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.4 8.6 H8.1 V23.4 H11.4" />
    <path d="M20.6 8.6 H23.9 V23.4 H20.6" />
  </g>
  <circle cx="16" cy="16" r="4.1" fill="#5EE7C4" />

  <text x="40" y="23"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="21" font-weight="650" letter-spacing="-0.5"
        fill="#8B5CF6">Way<tspan fill-opacity="0.62" font-weight="550">Club</tspan></text>
</svg>
